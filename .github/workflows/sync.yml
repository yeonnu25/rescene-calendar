name: 리센느 일정 동기화

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (정각은 GitHub가 붐벼서 늦어지기 쉬움)
  workflow_dispatch:        # Actions 화면에서 '지금 실행' 버튼으로도 실행 가능

permissions:
  contents: write           # 아래 '자동 실행 유지' 단계에서만 사용

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 동기화
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m rescene_sync

      # 공개 저장소는 60일 동안 변화가 없으면 GitHub가 자동 실행을 멈춰요.
      # 마지막 기록이 45일보다 오래되면 빈 기록을 하나 남겨서 계속 돌게 합니다.
      - name: 자동 실행 유지
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: 자동 실행 유지"
            git push
          fi
